name: Release binaries

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to use for the release."
        type: string
        required: true
      source_sha:
        description: "Exact commit SHA peeled from tag."
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Tag to use for the release."
        type: string
        required: true
      source_sha:
        description: "Exact commit SHA peeled from tag."
        type: string
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
  ZKSYNC_OS_SERVER_BIN: 'zksync-os-server'
  RELEASE_PROFILE: 'maxperf'
  SERVER_LOGFILE: zksync-os-server.log.txt
  FOUNDRY_VERSION: 'v1.5.1'
  # SYSCOIN: Fresh release artifacts expose only the canonical V32 identity.
  PROTOCOL_VERSION: 'v32.0'
  LOCAL_CHAINS_DIR: 'local-chains'

defaults:
  run:
    shell: 'bash -ex {0}'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      fixture_ready: ${{ steps.fixture.outputs.ready }}
    steps:
      - name: Validate requested release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          [[ "${RELEASE_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
      - name: Checkout exact release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify tag and fixture readiness
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SOURCE_SHA}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "${RELEASE_SOURCE_SHA}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          marker=local-chains/v32.0/CANONICAL_V8_REGENERATION_REQUIRED
          if [[ -e "${marker}" || -L "${marker}" ]]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "Canonical V32 fixture regeneration is pending; block-production smoke and fixture archive are omitted." >> "${GITHUB_STEP_SUMMARY}"
          else
            python3 scripts/apply-era-contracts-syscoin-release.py --check-canonical-fixture
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

  # Build server binaries for all target platforms
  build-bins:
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify checked-out release source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SOURCE_SHA}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "${RELEASE_SOURCE_SHA}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }

      - name: Checkout bound release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tooling
          sparse-checkout: .github/actions/build-release-server
          persist-credentials: false

      - name: Verify release tooling
        shell: bash
        env:
          TOOLING_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${TOOLING_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          [[ "$(git -C .release-tooling rev-parse HEAD)" == "${TOOLING_SHA}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          [[ -z "$(git -C .release-tooling status --porcelain --untracked-files=all)" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }

      - name: Build release binary
        uses: ./.release-tooling/.github/actions/build-release-server
        with:
          target: ${{ matrix.target }}

      - name: Recheck release source after build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SOURCE_SHA}" ]] || { echo "release source changed" >&2; exit 1; }
          git diff --quiet
          git diff --cached --quiet

      - name: Prepare tarballs
        run: |
          mv ./target/${{ matrix.target }}/${RELEASE_PROFILE}/${ZKSYNC_OS_SERVER_BIN} ./${ZKSYNC_OS_SERVER_BIN}
          tar -czf ${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-${{ matrix.target }}.tar.gz \
              ${{ env.ZKSYNC_OS_SERVER_BIN }}

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-${{ matrix.target }}.tar.gz
          path: ${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-${{ matrix.target }}.tar.gz


  # Smoke test release binaries
  # on different macOS and Linux runners
  test-bins:
    needs: [preflight, build-bins]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify checked-out release source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SOURCE_SHA}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "${RELEASE_SOURCE_SHA}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-${{ matrix.target }}.tar.gz

      - name: Check executable and dynamic linkage
        env:
          TARGET: ${{ matrix.target }}
          FIXTURE_READY: ${{ needs.preflight.outputs.fixture_ready }}
        run: |
          set -euo pipefail
          tar xzf "${ZKSYNC_OS_SERVER_BIN}-${RELEASE_TAG}-${TARGET}.tar.gz"
          "./${ZKSYNC_OS_SERVER_BIN}" --version
          "./${ZKSYNC_OS_SERVER_BIN}" --help > /dev/null
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/server-release-smoke.XXXXXX")"
          trap 'rm -rf "${smoke_dir}"' EXIT
          (
            cd "${smoke_dir}"
            env -i PATH="${PATH}" HOME="${HOME}" "${GITHUB_WORKSPACE}/${ZKSYNC_OS_SERVER_BIN}" config help > config-help.txt
            test -s config-help.txt
          )
          if [[ "${RUNNER_OS}" == Linux ]]; then
            dependencies="$(ldd "./${ZKSYNC_OS_SERVER_BIN}")"
            printf '%s\n' "${dependencies}"
            if [[ "${dependencies}" == *"not found"* ]]; then exit 1; fi
          else
            otool -L "./${ZKSYNC_OS_SERVER_BIN}"
          fi
          if [[ "${FIXTURE_READY}" != true ]]; then
            echo "Canonical fixture pending: only executable/CLI/linkage smoke ran; block production was not tested." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Install Foundry
        if: ${{ needs.preflight.outputs.fixture_ready == 'true' }}
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: '${{ env.FOUNDRY_VERSION }}'

      - name: Check block production with certified canonical fixture
        if: ${{ needs.preflight.outputs.fixture_ready == 'true' }}
        env:
          TIMEOUT: 60
          INTERVAL: 2
          PORT: 3050
        run: |
          L1_STATE_JSON="${LOCAL_CHAINS_DIR}/${PROTOCOL_VERSION}/l1-state.json"
          gzip -dfk "${L1_STATE_JSON}.gz"
          anvil --load-state "${L1_STATE_JSON}" \
            --port 8545 \
            --block-time 0.25 \
            --mixed-mining --slots-in-an-epoch 10 > anvil.log.txt 2>&1 &
          ./${ZKSYNC_OS_SERVER_BIN} > ${SERVER_LOGFILE} 2>&1 &
          elapsed=0
          while ! nc -z localhost ${PORT}; do
            if (( elapsed >= TIMEOUT )); then
              echo "Timeout reached after $elapsed seconds. Server did not start."
              cat "${SERVER_LOGFILE}"
              exit 1
            fi
            echo "Waiting for server to start..."
            sleep ${INTERVAL}
            (( elapsed += INTERVAL ))
          done
          echo "Sequencer is up and running."
          FIRST_BLOCK=$(curl -X POST http://localhost:${PORT} \
            -H "Content-Type: application/json" \
            -d '{
              "jsonrpc": "2.0",
              "method": "eth_getBlockByNumber",
              "params": ["0x1", false],
              "id": 1
            }')
          # Check that the response contains a hash and a non-empty transactions array
          if echo "${FIRST_BLOCK}" | jq -e '.result.hash and (.result.transactions | length > 0)' >/dev/null; then
            echo "✅ First block is correct."
          else
            echo "❌ Missing hash or transactions array is empty in the first block."
            echo "${FIRST_BLOCK}"
            cat "${SERVER_LOGFILE}"
            # SYSCOIN: Diagnostic output must not turn a failed release smoke check green.
            exit 1
          fi



  # Package and attest the exact archives before publication.
  release-bins:
    needs: [preflight, build-bins, test-bins]
    # Run on macOS to combine binaries into a single one for macOS
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation_url: ${{ steps.attestation.outputs.attestation-url }}
    steps:

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify checked-out release source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SOURCE_SHA}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "${RELEASE_SOURCE_SHA}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ env.ZKSYNC_OS_SERVER_BIN }}-*.tar.gz
          path: dist
          merge-multiple: true

      - name: Create universal macOS binary
        run: |
          find .
          for TARGET in x86_64-apple-darwin aarch64-apple-darwin; do
            tar xzf dist/${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-${TARGET}.tar.gz
            mv ${{ env.ZKSYNC_OS_SERVER_BIN }} ${{ env.ZKSYNC_OS_SERVER_BIN }}-${TARGET}
            rm -f dist/${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-${TARGET}.tar.gz
          done
          lipo -create -o "${{ env.ZKSYNC_OS_SERVER_BIN }}" \
            ${{ env.ZKSYNC_OS_SERVER_BIN }}-x86_64-apple-darwin ${{ env.ZKSYNC_OS_SERVER_BIN }}-aarch64-apple-darwin
          tar -czf dist/${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-universal-apple-darwin.tar.gz \
            ${{ env.ZKSYNC_OS_SERVER_BIN }}

      - name: Archive certified local chains
        if: ${{ needs.preflight.outputs.fixture_ready == 'true' }}
        run: tar -czf dist/local-chains.tar.gz "${LOCAL_CHAINS_DIR}"

      - name: Validate complete release inventory
        env:
          TARGET_TAG: ${{ inputs.tag }}
          FIXTURE_READY: ${{ needs.preflight.outputs.fixture_ready }}
        run: |
          set -euo pipefail
          python3 - <<'PY_INVENTORY'
          import os
          from pathlib import Path
          root = Path("dist")
          tag = os.environ["TARGET_TAG"]
          expected = {
              f"zksync-os-server-{tag}-x86_64-unknown-linux-gnu.tar.gz",
              f"zksync-os-server-{tag}-aarch64-unknown-linux-gnu.tar.gz",
              f"zksync-os-server-{tag}-universal-apple-darwin.tar.gz",
          }
          if os.environ["FIXTURE_READY"] == "true":
              expected.add("local-chains.tar.gz")
          elif os.environ["FIXTURE_READY"] != "false":
              raise SystemExit("unknown fixture readiness")
          files = list(root.iterdir())
          if {p.name for p in files} != expected or any(p.is_symlink() or not p.is_file() for p in files):
              raise SystemExit("release inventory is incomplete or contains unexpected files")
          PY_INVENTORY

      - name: Generate build provenance predicate
        id: build-provenance
        uses: actions/attest-build-provenance/predicate@864457a58d4733d7f1574bd8821fa24e02cf7538 # predicate@2.0.0

      - name: Bind exact release source
        env:
          BASE_PROVENANCE: ${{ steps.build-provenance.outputs.predicate }}
          BASE_PROVENANCE_TYPE: ${{ steps.build-provenance.outputs.predicate-type }}
          TOOLING_SHA: ${{ job.workflow_sha }}
          TOOLING_REPOSITORY: ${{ job.workflow_repository }}
          FIXTURE_READY: ${{ needs.preflight.outputs.fixture_ready }}
        run: |
          set -euo pipefail
          [[ "${BASE_PROVENANCE_TYPE}" == https://slsa.dev/provenance/v1 ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          [[ "${TOOLING_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          jq -e --arg uri "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@refs/tags/${RELEASE_TAG}" \
            --arg sha "${RELEASE_SOURCE_SHA}" \
            --arg tooling_uri "git+${GITHUB_SERVER_URL}/${TOOLING_REPOSITORY}@${TOOLING_SHA}" \
            --arg tooling_sha "${TOOLING_SHA}" \
            --arg fixture_ready "${FIXTURE_READY}" '
              if .buildDefinition.buildType != "https://actions.github.io/buildtypes/workflow/v1"
                or (.buildDefinition.resolvedDependencies | type) != "array"
                or (.runDetails.builder.id | type) != "string"
              then error("unexpected provenance shape") else . end
              | .buildDefinition.resolvedDependencies |=
                  if any(.[]; .uri == $uri and .digest.gitCommit != $sha) then
                    error("conflicting release source")
                  elif any(.[]; .uri == $uri and .digest.gitCommit == $sha) then .
                  else . + [{uri: $uri, digest: {gitCommit: $sha}}] end
              | .buildDefinition.resolvedDependencies += [{uri: $tooling_uri, digest: {gitCommit: $tooling_sha}}]
              | .buildDefinition.internalParameters.syscoinCanonicalFixture = $fixture_ready
            ' <<< "${BASE_PROVENANCE}" > "${RUNNER_TEMP}/server-release-provenance.json"

      - name: Binaries attestation
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/**'
          predicate-type: 'https://slsa.dev/provenance/v1'
          predicate-path: ${{ runner.temp }}/server-release-provenance.json

      - name: Stage complete release archives
        env:
          FIXTURE_READY: ${{ needs.preflight.outputs.fixture_ready }}
          ATTESTATION_URL: ${{ steps.attestation.outputs.attestation-url }}
        run: |
          set -euo pipefail
          mkdir -p staged-release
          cp -R dist staged-release/dist
          jq -n --arg tag "${RELEASE_TAG}" --arg source_sha "${RELEASE_SOURCE_SHA}" \
            --arg fixture_ready "${FIXTURE_READY}" --arg run_id "${GITHUB_RUN_ID}" \
            '{tag:$tag, source_sha:$source_sha, fixture_ready:$fixture_ready, run_id:$run_id}' > staged-release/metadata.json
          printf '%s\n' "${ATTESTATION_URL}" > staged-release/attestation-url.txt

      - name: Upload staged release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-release-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: staged-release/
          if-no-files-found: error

  publish-bins:
    needs: [preflight, release-bins]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify release source before publication
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SOURCE_SHA}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "${RELEASE_SOURCE_SHA}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }

      - name: Download staged release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-release-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: staged-release

      - name: Validate staged release identity
        env:
          FIXTURE_READY: ${{ needs.preflight.outputs.fixture_ready }}
          ATTESTATION_URL: ${{ needs.release-bins.outputs.attestation_url }}
        run: |
          set -euo pipefail
          jq -e --arg tag "${RELEASE_TAG}" --arg sha "${RELEASE_SOURCE_SHA}" \
            --arg ready "${FIXTURE_READY}" --arg run "${GITHUB_RUN_ID}" \
            '.tag == $tag and .source_sha == $sha and .fixture_ready == $ready and .run_id == $run' staged-release/metadata.json > /dev/null
          [[ "$(cat staged-release/attestation-url.txt)" == "${ATTESTATION_URL}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          mv staged-release/dist dist
          python3 - <<'PY_INVENTORY'
          import os
          from pathlib import Path
          root = Path("dist")
          tag = os.environ["RELEASE_TAG"]
          expected = {
              f"zksync-os-server-{tag}-x86_64-unknown-linux-gnu.tar.gz",
              f"zksync-os-server-{tag}-aarch64-unknown-linux-gnu.tar.gz",
              f"zksync-os-server-{tag}-universal-apple-darwin.tar.gz",
          }
          if os.environ["FIXTURE_READY"] == "true":
              expected.add("local-chains.tar.gz")
          elif os.environ["FIXTURE_READY"] != "false":
              raise SystemExit("unknown fixture readiness")
          files = list(root.iterdir())
          if {p.name for p in files} != expected or any(p.is_symlink() or not p.is_file() for p in files):
              raise SystemExit("staged release inventory is incomplete or contains unexpected files")
          PY_INVENTORY

      - name: Checkout bound publication tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-publication-tooling
          sparse-checkout: scripts/release
          persist-credentials: false

      - name: Upload immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOOLING_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${TOOLING_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          [[ "$(git -C .release-publication-tooling rev-parse HEAD)" == "${TOOLING_SHA}" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          [[ -z "$(git -C .release-publication-tooling status --porcelain --untracked-files=all)" ]] || { echo "release identity or provenance mismatch" >&2; exit 1; }
          python3 -B .release-publication-tooling/scripts/release/publish-release-assets.py "${RELEASE_TAG}" dist/*.tar.gz

      - name: Update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIXTURE_READY: ${{ needs.preflight.outputs.fixture_ready }}
        run: |
          if [[ "${FIXTURE_READY}" == true ]]; then
            FIXTURE_NOTICE="Canonical fixture smoke: passed; local chain archive included."
          else
            FIXTURE_NOTICE="Canonical V32 fixture regeneration is pending. Binary CLI and linkage checks passed; block-production smoke was not run and no canonical local-chain archive is included."
          fi
          REALASE_BODY=$(gh release view "${RELEASE_TAG}" --json body -q '.body')
          BINARIES_SECTION=$(cat <<- "ENDBODY"
          ## Binaries
          
          | System | Architecture | Binary | Attestation |
          |:---:|:---:|:---:|:---|
          | <img src="https://www.svgrepo.com/download/448236/linux.svg" width="50"/> | x86_64 | [${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-x86_64-unknown-linux-gnu.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-x86_64-unknown-linux-gnu.tar.gz) | [Attestation](${{ needs.release-bins.outputs.attestation_url }}) |
          | <img src="https://www.svgrepo.com/download/448236/linux.svg" width="50"/> | aarch64 | [${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-aarch64-unknown-linux-gnu.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-aarch64-unknown-linux-gnu.tar.gz) | [Attestation](${{ needs.release-bins.outputs.attestation_url }}) |
          | <img src="https://www.svgrepo.com/download/475429/apple.svg" width="50"/> | universal | [${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-universal-apple-darwin.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}-universal-apple-darwin.tar.gz) | [Attestation](${{ needs.release-bins.outputs.attestation_url }}) |
          | <img src="https://www.svgrepo.com/download/452192/docker.svg" width="50"/> | Docker | [${{ env.ZKSYNC_OS_SERVER_BIN }}-${{ inputs.tag }}](https://github.com/${{ github.repository }}/pkgs/container/zksync-os-server?tag=${{ inputs.tag }}) | - |
          ENDBODY
          )
          printf '%s\n\n%s\n\n%s\n' "${REALASE_BODY}" "${BINARIES_SECTION}" "${FIXTURE_NOTICE}" > updated_body.md
          gh release edit "${RELEASE_TAG}" --notes-file updated_body.md
