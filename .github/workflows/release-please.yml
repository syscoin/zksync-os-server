name: Release-please

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      source_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout release inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check reviewed release inputs
        run: python3 scripts/check-server-release-inputs.py
      - name: Prepare release
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

      - name: Align generated workspace versions
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: python3 .github/scripts/sync-release-workspace.py

  # GITHUB_TOKEN-created tags do not trigger other push workflows, so invoke
  # both publishers directly with the released commit identity.
  release-bins:
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    needs: release-please
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-bins.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      source_sha: ${{ needs.release-please.outputs.source_sha }}

  release-images:
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    needs: release-please
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      source_sha: ${{ needs.release-please.outputs.source_sha }}
