name: Release-please

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact private draft release ID to promote (provide all three inputs)
        type: string
      tag:
        description: Exact version tag from the draft
        type: string
      source_sha:
        description: Exact CPU and CUDA qualified draft source SHA
        type: string

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_id: ${{ steps.candidate.outputs.release_id }}
      tag_name: ${{ steps.candidate.outputs.tag }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
    steps:
      - name: Checkout release inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Check reviewed release inputs
        if: ${{ !inputs.release_id && !inputs.tag && !inputs.source_sha }}
        run: python3 scripts/check-server-release-inputs.py
      - name: Select exact candidate or stage its private draft
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RELEASE_ID: ${{ inputs.release_id }}
          SELECTED_RELEASE_TAG: ${{ inputs.tag }}
          SELECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 -I -B scripts/release/prepare-qualified-release.py prepare

      - name: Prepare the next release PR
        id: release
        if: ${{ steps.candidate.outputs.prepare_pr == 'true' }}
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-release: true

      - name: Align generated workspace versions
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: python3 .github/scripts/sync-release-workspace.py

  qualify:
    if: ${{ needs.release-please.outputs.release_id != '' }}
    needs: release-please
    permissions:
      contents: read
      statuses: read
    uses: ./.github/workflows/release-qualification.yml
    with:
      source_sha: ${{ needs.release-please.outputs.source_sha }}

  publish:
    needs: [release-please, qualify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Checkout reviewed publication tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: release-tooling
          sparse-checkout: scripts/release/prepare-qualified-release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout the qualified source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.source_sha }}
          path: release-source
          persist-credentials: false

      - name: Check reviewed release inputs for the qualified source
        working-directory: release-source
        run: python3 scripts/check-server-release-inputs.py

      - name: Publish the exact verified release
        id: release
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
          SELECTED_RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SELECTED_SOURCE_SHA: ${{ needs.release-please.outputs.source_sha }}
        run: python3 -I -B ../release-tooling/scripts/release/prepare-qualified-release.py publish

  # GITHUB_TOKEN-created tags do not trigger other push workflows.
  release-bins:
    needs: publish
    permissions:
      contents: write
      statuses: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-bins.yml
    with:
      tag: ${{ needs.publish.outputs.tag_name }}
      source_sha: ${{ needs.publish.outputs.source_sha }}

  release-images:
    needs: publish
    permissions:
      contents: read
      statuses: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    with:
      tag_name: ${{ needs.publish.outputs.tag_name }}
      source_sha: ${{ needs.publish.outputs.source_sha }}
