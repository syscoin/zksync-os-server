name: Resume server binary release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Original release tag
        required: true
        type: string
      source_sha:
        description: Commit peeled from the release tag
        required: true
        type: string
      original_run_id:
        description: Run ID that staged the original release archives
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: write

concurrency:
  group: server-release-resume-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resume:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
    steps:
      - name: Check out reviewed recovery tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate original run
        run: python3 -B scripts/release/resume-release-bins.py validate-run

      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release-source
          persist-credentials: false

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C release-source rev-parse HEAD)" == "${RELEASE_SOURCE_SHA}" ]]
          [[ "$(git -C release-source rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "${RELEASE_SOURCE_SHA}" ]]

      - name: Download original staged release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-release-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: staged-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.original_run_id }}

      - name: Verify and resume release
        run: python3 -B scripts/release/resume-release-bins.py publish staged-release
