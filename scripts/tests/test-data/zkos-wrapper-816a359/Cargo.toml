[workspace]
resolver = "2"

members = ["circuit_mersenne_field", "wrapper", "wrapper_generator"]


[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zkos-wrapper/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync", "zk", "risc-v"]
categories = ["cryptography"]


[workspace.dependencies]

circuit_mersenne_field = { path = "circuit_mersenne_field" }

boojum = { git = "https://github.com/matter-labs/zksync-crypto.git", package = "boojum", branch = "oh_for_wrapper" }
bellman = { git = "https://github.com/matter-labs/zksync-crypto.git", package = "zksync_bellman", branch = "oh_for_wrapper" }
rescue_poseidon = { git = "https://github.com/matter-labs/zksync-crypto.git", package = "rescue_poseidon", branch = "oh_for_wrapper" }
snark_wrapper = { git = "https://github.com/matter-labs/zksync-crypto.git", package = "snark_wrapper", branch = "oh_for_wrapper" }

unified_reduced_machine_verifier = { git = "https://github.com/syscoin/zksync-airbender", rev = "0d8c852954afcae1f160151a17fe80886f1755b0", package = "unified_reduced_machine_verifier", features = [
  "proof_utils",
  "blake2_with_compression",
], default-features = false }
blake_verifier = { git = "https://github.com/syscoin/zksync-airbender", rev = "0d8c852954afcae1f160151a17fe80886f1755b0", package = "blake2_with_compression_verifier", features = [
  "proof_utils",
  "blake2_with_compression",
], default-features = false }
execution_utils = { git = "https://github.com/syscoin/zksync-airbender", rev = "0d8c852954afcae1f160151a17fe80886f1755b0", package = "execution_utils", features = [
  "prover",
  "verifier_binaries",
], default-features = false }
setups = { git = "https://github.com/syscoin/zksync-airbender", rev = "0d8c852954afcae1f160151a17fe80886f1755b0", package = "setups" }
mersenne_field = { git = "https://github.com/syscoin/zksync-airbender", rev = "0d8c852954afcae1f160151a17fe80886f1755b0", package = "field", features = [
  "no_inline",
] }
zkos_verifier_generator = { git = "https://github.com/syscoin/zksync-airbender", rev = "0d8c852954afcae1f160151a17fe80886f1755b0", package = "verifier_generator" }
prover = { git = "https://github.com/syscoin/zksync-airbender", rev = "0d8c852954afcae1f160151a17fe80886f1755b0", package = "prover" }

# unified_reduced_machine_verifier = { path = "../zksync-airbender/circuit_defs/unrolled_circuits/unified_reduced_machine/verifier", features = [
#     "proof_utils", "blake2_with_compression"
# ], default-features = false}
# blake_verifier = { path = "../zksync-airbender/circuit_defs/blake2_with_compression/verifier", package = "blake2_with_compression_verifier", features = [
#     "proof_utils", "blake2_with_compression"
# ], default-features = false}
# execution_utils = { path = "../zksync-airbender/execution_utils", package = "execution_utils", features = [
#     "prover"
# ], default-features = false}
# setups = { path = "../zksync-airbender/circuit_defs/setups", package = "setups"}
# mersenne_field = { path = "../zksync-airbender/field", package = "field"}
# zkos_verifier_generator = { path = "../zksync-airbender/verifier_generator", package = "verifier_generator"}
# prover = { path = "../zksync-airbender/prover", package = "prover"}

serde_json = { version = "*" }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }
bincode = { version = "2", features = ["serde"] }
clap = { version = "4.5.21", features = ["derive"] }
sha3 = "*"
rand = "0.8"

# Used for GPU proving.
shivini = { git = "https://github.com/matter-labs/zksync-crypto-gpu.git", package = "shivini", branch = "oh_for_wrapper" }
proof-compression = { git = "https://github.com/matter-labs/zksync-crypto-gpu.git", package = "proof-compression", branch = "oh_for_wrapper" }
zksync-gpu-prover = { git = "https://github.com/matter-labs/zksync-crypto-gpu.git", package = "zksync-gpu-prover", branch = "oh_for_wrapper" }

# shivini = { path = "../zksync-crypto-gpu/crates/shivini", package = "shivini" }
# proof-compression = { path = "../zksync-crypto-gpu/crates/proof-compression", package = "proof-compression" }
# zksync-gpu-prover = { path = "../zksync-crypto-gpu/crates/gpu-prover", package = "zksync-gpu-prover" }

tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"

[profile.release.package."blake2_with_compression_verifier"]
opt-level = 1
codegen-units = 256
overflow-checks = true

[profile.release.package."zkos-wrapper"]
opt-level = 2

[profile.release]
lto = false
# This is needed for zksync-airbender crates to compile in a reasonable time for x86-64-unknown-linux-gnu
overflow-checks = true
