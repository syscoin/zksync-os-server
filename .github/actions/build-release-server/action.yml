name: Build a server release binary
description: Build a target with the pinned patched ZKsync OS workspace.
inputs:
  target:
    description: Native Rust target triple
    required: true
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends curl jq libssl-dev libclang-dev pkg-config build-essential
    - name: Install pinned Rust toolchain
      uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        inherit-toolchain: true
        cache: false
    - name: Build server
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RUSTFLAGS: '--cfg tokio_unstable'
        CARGO_BUILD_JOBS: '2'
      run: |
        set -euo pipefail
        case "${TARGET}" in
          x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu|x86_64-apple-darwin|aarch64-apple-darwin) ;;
          *) echo 'unsupported release target' >&2; exit 1 ;;
        esac
        GATEWAY_DIR="${RUNNER_TEMP}/syscoin-zksync-os-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TARGET}" \
          bash scripts/cargo-with-patched-zksync-os.sh "release-${TARGET}" -- \
            build --locked --profile maxperf --target "${TARGET}" --bin zksync-os-server --features gcp
