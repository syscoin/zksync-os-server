[package]
name = "zksync_os_multivm"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

build = "build.rs"

[dependencies]
zksync_os_interface.workspace = true
zksync_os_storage_api.workspace = true
# SYSCOIN: Fresh V32 runs only the pinned v0.4.0 guest exposed through the canonical alias.
zk_os_forward_system.workspace = true
zksync_os_native_pig.workspace = true
anyhow.workspace = true
zksync_os_types.workspace = true
alloy = { workspace = true, default-features = false, features = [
    "consensus",
    "eips",
    "rlp",
] }

[build-dependencies]
anyhow.workspace = true
cargo_metadata = { workspace = true, default-features = false }
# SYSCOIN: The V32 build verifies the locally patched, hash-pinned guest without downloading it.
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
test-casing.workspace = true
