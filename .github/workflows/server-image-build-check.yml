name: Hosted server image build

on:
  pull_request:
    paths:
      - '.github/workflows/docker.yml'
      - '.github/workflows/server-image-build-check.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'bin/**'
      - 'lib/**'
      - 'components/**'
      - 'node/**'
      - 'config-presets/**'
      - 'contracts/**'
      - 'loadbase/**'
      - 'tools/**'
      - 'scripts/**'
      - 'patches/**'

permissions:
  contents: read

jobs:
  image:
    name: Build server image without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free space on the ephemeral runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker image prune --all --force
          df -h /
      - name: Checkout proposed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build without registry credentials
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          no-cache: true
