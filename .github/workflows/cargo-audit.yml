name: Security audit (Linux server)

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Run every Monday-Friday at 8:30 AM UTC.
    - cron: "30 8 * * 1-5"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install pinned cargo-audit
        run: cargo install --locked cargo-audit@0.22.0
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test applicability guards
        run: python3 -m unittest scripts.tests.test_root_compat scripts.tests.test_native_audit -v
      - name: Audit reviewed native Linux configuration
        run: python3 scripts/check-native-audit.py audit
      - name: Preserve raw audit and review results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-cargo-audit
          path: target/security-audit/

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Install pinned cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test applicability guards
        run: python3 -m unittest scripts.tests.test_root_compat scripts.tests.test_native_audit -v
      - name: Audit reviewed native Linux configuration
        run: python3 scripts/check-native-audit.py deny
      - name: Preserve raw audit and review results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-cargo-deny
          path: target/security-audit/
