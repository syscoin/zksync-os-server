name: Docker build and release

on:
  workflow_call:
    inputs:
      tag_name:
        description: Existing release tag for the image source
        type: string
        required: true
      source_sha:
        description: Exact 40-character commit peeled from tag_name
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag for the image source
        type: string
        required: true
      source_sha:
        description: Exact 40-character commit peeled from tag_name
        type: string
        required: true
  push:
    branches: [main]
    tags: ['v**']

permissions:
  contents: read

concurrency:
  group: server-docker-${{ github.repository }}-${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-source:
    name: Resolve image source
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.requested.outputs.ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      image_name: ${{ steps.source.outputs.image_name }}
    steps:
      - name: Validate requested source
        id: requested
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ -n "${TAG_NAME}" || -n "${SOURCE_SHA}" || "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            [[ "${TAG_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || exit 1
            [[ "${TAG_NAME}" != latest ]] || exit 1
            [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
            ref="refs/tags/${TAG_NAME}"
          elif [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            ref="${GITHUB_REF}"
          else
            ref="${GITHUB_SHA}"
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout requested source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.requested.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind source and image identity
        id: source
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "${actual}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || exit 1
          if [[ -n "${TAG_NAME}" || -n "${SOURCE_SHA}" || "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            [[ "$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")" == "${actual}" ]] || exit 1
            [[ "${actual}" == "${SOURCE_SHA}" ]] || exit 1
            version="${TAG_NAME}"
          elif [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            [[ "$(git rev-parse "${GITHUB_REF}^{commit}")" == "${actual}" ]] || exit 1
            tag_object="$(git rev-parse "${GITHUB_REF}")"
            [[ "${GITHUB_SHA}" == "${actual}" || "${GITHUB_SHA}" == "${tag_object}" ]] || exit 1
            version="${GITHUB_REF_NAME}"
          else
            [[ "${actual}" == "${GITHUB_SHA}" ]] || exit 1
            version="${actual}"
          fi
          [[ "${version}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || exit 1
          [[ "${version}" != latest ]] || exit 1
          owner="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          [[ "${owner}" =~ ^[a-z0-9][a-z0-9-]*$ ]] || exit 1
          echo "source_sha=${actual}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image_name=ghcr.io/${owner}/zksync-os-server" >> "${GITHUB_OUTPUT}"

  build-images:
    name: Build server OCI image
    needs: resolve-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Free space on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker image prune --all --force
          df -h /

      - name: Checkout exact image source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ needs.resolve-source.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.resolve-source.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.tag_name == '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build server image
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=oci,tar=false,dest=${{ runner.temp }}/server-image
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Upload image layout
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-oci-image
          path: ${{ runner.temp }}/server-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish-image:
    name: Publish and attest server image
    needs: [resolve-source, build-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Download image layout from the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-images.outputs.artifact_id }}
          path: ${{ runner.temp }}/server-image

      - name: Checkout qualification tooling
        if: ${{ inputs.tag_name || github.ref_type == 'tag' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: qualification-tooling
          sparse-checkout: .github/scripts/check-canonical-qualification.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout the versioned qualification source
        if: ${{ inputs.tag_name || github.ref_type == 'tag' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-source.outputs.ref }}
          path: release-source
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify canonical qualification for a versioned release
        if: ${{ inputs.tag_name || github.ref_type == 'tag' }}
        working-directory: release-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYSCOIN_CANONICAL_QUALIFIER_ID: ${{ vars.SYSCOIN_CANONICAL_QUALIFIER_ID }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 -I -B ../qualification-tooling/.github/scripts/check-canonical-qualification.py --source-sha "${RELEASE_SOURCE_SHA}"

      - name: Publish verified image digest
        id: publish
        env:
          IMAGE_NAME: ${{ needs.resolve-source.outputs.image_name }}
          VERSION: ${{ needs.resolve-source.outputs.version }}
          PUBLISH_LATEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.tag_name == '' }}
          EXPECTED_DIGEST: ${{ needs.build-images.outputs.image_digest }}
        run: |
          set -euo pipefail
          layout="${RUNNER_TEMP}/server-image"
          authfile="${DOCKER_CONFIG:-${HOME}/.docker}/config.json"
          [[ "${EXPECTED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Buildx did not report an OCI digest' >&2; exit 1; }
          digest="$(jq -er '.manifests | select(length == 1) | .[0].digest' "${layout}/index.json")"
          [[ "${digest}" == "${EXPECTED_DIGEST}" ]] || { echo 'OCI index differs from the Buildx digest' >&2; exit 1; }
          blob="${layout}/blobs/sha256/${digest#sha256:}"
          [[ "sha256:$(sha256sum "${blob}" | cut -d' ' -f1)" == "${digest}" ]] || { echo 'OCI index content does not match its digest' >&2; exit 1; }

          publish_tag() {
            local destination="docker://${IMAGE_NAME}:${1}"
            local digestfile="${RUNNER_TEMP}/published-image-digest"
            local published
            skopeo copy --all --preserve-digests --authfile "${authfile}" --digestfile "${digestfile}" "oci:${layout}" "${destination}"
            [[ "$(cat "${digestfile}")" == "${digest}" ]] || { echo 'Registry copy did not preserve the OCI digest' >&2; exit 1; }
            published="$(skopeo inspect --raw --authfile "${authfile}" "${destination}" | sha256sum | cut -d' ' -f1)"
            [[ "sha256:${published}" == "${digest}" ]] || { echo 'Published tag resolves to a different digest' >&2; exit 1; }
          }

          publish_tag "${VERSION}"
          if [[ "${PUBLISH_LATEST}" == true ]]; then
            publish_tag latest
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Generate build provenance
        id: predicate
        uses: actions/attest-build-provenance/predicate@864457a58d4733d7f1574bd8821fa24e02cf7538 # predicate@2.0.0

      - name: Bind checked source to provenance
        env:
          PREDICATE: ${{ steps.predicate.outputs.predicate }}
          PREDICATE_TYPE: ${{ steps.predicate.outputs.predicate-type }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          SOURCE_REF: ${{ needs.resolve-source.outputs.ref }}
        run: |
          set -euo pipefail
          [[ "${PREDICATE_TYPE}" == https://slsa.dev/provenance/v1 ]] || exit 1
          jq -e --arg source_uri "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@${SOURCE_REF}" --arg source_sha "${SOURCE_SHA}" '
            if .buildDefinition.buildType != "https://actions.github.io/buildtypes/workflow/v1" or
               (.buildDefinition.resolvedDependencies | type) != "array" or
               (.runDetails.builder.id | type) != "string" then error("unexpected provenance shape") else . end
            | .buildDefinition.resolvedDependencies |=
              if any(.[]; .uri == $source_uri and .digest.gitCommit != $source_sha) then
                error("source conflicts with provenance")
              elif any(.[]; .uri == $source_uri and .digest.gitCommit == $source_sha) then .
              else . + [{uri: $source_uri, digest: {gitCommit: $source_sha}}] end
          ' <<< "${PREDICATE}" > "${RUNNER_TEMP}/server-image-provenance.json"

      - name: Recheck canonical qualification before registry attestation
        if: ${{ inputs.tag_name || github.ref_type == 'tag' }}
        working-directory: release-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYSCOIN_CANONICAL_QUALIFIER_ID: ${{ vars.SYSCOIN_CANONICAL_QUALIFIER_ID }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 -I -B ../qualification-tooling/.github/scripts/check-canonical-qualification.py --source-sha "${RELEASE_SOURCE_SHA}"

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.resolve-source.outputs.image_name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/server-image-provenance.json
          push-to-registry: true

  sbom-generation:
    name: SBOM
    needs: [resolve-source, publish-image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/sbom-analysis-reusable.yaml
    secrets: inherit
    with:
      version: ${{ needs.resolve-source.outputs.version }}
      source_sha: ${{ needs.resolve-source.outputs.source_sha }}
      image_name: ${{ needs.resolve-source.outputs.image_name }}
      image_digest: ${{ needs.publish-image.outputs.image_digest }}
