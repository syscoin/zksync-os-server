name: Hosted server release build

on:
  pull_request:
    paths:
      - '.github/workflows/release-bins.yml'
      - '.github/workflows/release-build-check.yml'
      - '.github/actions/build-release-server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/**'
      - 'contracts/**'
      - 'lib/**'
      - 'node/**'
      - 'bin/**'
      - 'crates/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build server (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out proposed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify proposed source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || { echo "source mismatch" >&2; exit 1; }
      - name: Build release binary without publishing
        uses: ./.github/actions/build-release-server
        with:
          target: ${{ matrix.target }}
      - name: Check native executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="${GITHUB_WORKSPACE}/target/${TARGET}/maxperf/zksync-os-server"
          "${binary}" --version
          "${binary}" --help > /dev/null
          if [[ "${RUNNER_OS}" == Linux ]]; then
            dependencies="$(ldd "${binary}")"
            printf '%s\n' "${dependencies}"
            if [[ "${dependencies}" == *"not found"* ]]; then exit 1; fi
          else
            otool -L "${binary}"
          fi
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/server-release-smoke.XXXXXX")"
          trap 'rm -rf "${smoke_dir}"' EXIT
          (
            cd "${smoke_dir}"
            env -i PATH="${PATH}" HOME="${HOME}" "${binary}" config help > config-help.txt
            test -s config-help.txt
          )
