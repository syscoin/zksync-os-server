[package]
name = "syscoin-end-params-harness"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "end_params"
path = "src/end_params.rs"

[dependencies]
execution_utils = { git = "https://github.com/syscoin/zksync-airbender", rev = "a4484a145fdc1062f2df9b8d3a4b0697c9b18e0c", default-features = false, features = ["prover", "verifier_binaries"] }
riscv_transpiler = { git = "https://github.com/syscoin/zksync-airbender", rev = "a4484a145fdc1062f2df9b8d3a4b0697c9b18e0c", default-features = false }
verifier_common = { git = "https://github.com/syscoin/zksync-airbender", rev = "a4484a145fdc1062f2df9b8d3a4b0697c9b18e0c", default-features = false }

# Match the pinned upstream release profile, not the companion prover's build profile.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
